# Mirrors the Swiss source datasets (swisstopo swissALTI3D, City of Zurich
# statistical quarters) into the `source-data` release of this repository.
#
# `python -m zrh_flat_routes download` fetches from the publishers first and
# falls back to these release assets only when their hosts are unreachable
# (some sandboxed build environments block them). The files are the
# publishers' own, unmodified, except DHM25, which is cut from the national
# grid to a window around Zurich; provenance.tar.gz records where and when
# each was fetched, with checksums and the licence pages in force at the time.
# swisstopo's building-address register is likewise cut from the national
# file to the rows inside the study area.
name: Mirror source data

on:
  workflow_dispatch:
  push:
    branches: [claude/optimistic-gates-l0pbj3]
    paths: ["scripts/mirror_sources.py", ".github/workflows/mirror-data.yml"]

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy rasterio
      - name: Fetch from the publishers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The 358 MB of elevation tiles are fetched once; later runs refresh
          # the rest and keep the release's existing tiles.
          args=""
          if gh release view source-data --json assets -q '.assets[].name' 2>/dev/null | grep -q '^swissalti3d_'; then
            args="--skip-alti"
          fi
          python scripts/mirror_sources.py mirror $args
      - name: Publish to the source-data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la mirror
          files="mirror/provenance.tar.gz mirror/stadtzh_boundaries.tar.gz"
          for f in mirror/swissalti3d_*.tar mirror/dhm25_*.tif mirror/osm_incline_*.json mirror/swisstopo_addresses_*.csv; do [ -f "$f" ] && files="$files $f"; done
          if ! gh release view source-data >/dev/null 2>&1; then
            gh release create source-data --target "$GITHUB_SHA" --prerelease \
              --title "Source data mirror" \
              --notes "Unmodified copies of swisstopo swissALTI3D (2 m) tiles covering Zurich and the City of Zurich statistical quarters, for build environments that cannot reach the publishers. swissALTI3D: Source: Federal Office of Topography swisstopo. Quarters: Stadt Zürich Open Government Data. See provenance.tar.gz for URLs, dates, checksums and licence terms."
          fi
          gh release upload source-data $files --clobber
          gh release edit source-data --notes "Copies of source data for build environments that cannot reach the publishers. Fetched by .github/workflows/mirror-data.yml; provenance.tar.gz records every URL, retrieval date and checksum, with the publishers' licence pages.

          - swissalti3d_2m_zurich.tar: swissALTI3D 2 m tiles covering Zurich, unmodified. Source: Federal Office of Topography swisstopo.
          - dhm25_zurich_lv03.tif: DHM25 matrix model, cut to a window around Zurich. Source: Federal Office of Topography swisstopo.
          - swisstopo_addresses_zurich.csv: official directory of building addresses, rows inside the study area. Source: Federal Office of Topography swisstopo.
          - stadtzh_boundaries.tar.gz: statistical quarters and districts of the City of Zurich (Stadt Zürich, Open Data Zürich, CC0).
          - osm_incline_zurich.json: OpenStreetMap ways with an incline tag. © OpenStreetMap contributors, ODbL 1.0."
