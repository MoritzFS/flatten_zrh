# Publishes site/ (the built route finder) to GitHub Pages at
# https://moritzfs.github.io/flatten_zrh/.
#
# The site is committed already built, because building it needs the cached
# elevation tiles and Overture data (~400 MB) that CI does not fetch. Pages
# must be set to Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions" (the Actions token cannot create the Pages site itself).
#
# Adapted from flattensf's workflow (Drew Edwards, MIT licence).
name: Deploy the route finder

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
